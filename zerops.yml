zerops:
  - setup: spartanng
    build:
      base: nodejs@22
      envVariables:
        NODE_OPTIONS: --max-old-space-size=8192
      buildCommands:
        - pnpm i
        - npx nx build app --prod
      deployFiles:
        - dist/apps/app/analog/~
        - tools/scripts/~drizzle-migrate.config.js
    run:
      base: nodejs@22
      envVariables:
        DATABASE_URL: ${db_connectionString}/${db_dbName}
      initCommands:
        - zsc execOnce $appVersionId -- npx drizzle-kit migrate --config=drizzle-migrate.config.js
      ports:
        - port: 3000
          httpSupport: true
      start: node server/index.mjs
